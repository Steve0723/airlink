services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      AIRLINK_RELAY_KEY: ${AIRLINK_RELAY_KEY:?请在 .env 里设置上传密钥}
      AIRLINK_RELAY_BASE: https://${DOMAIN:?请在 .env 里设置域名}
    volumes:
      - relay_data:/data
    ports:
      # 只绑本地回环，由宿主机上已有的 nginx 反代进来。
      # 不占 80/443，避免和 nginx 抢端口。
      - "127.0.0.1:8080:8080"

volumes:
  relay_data:
