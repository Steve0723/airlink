name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: 编译
        working-directory: server
        shell: pwsh
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o AirLink.exe .
          Get-Item AirLink.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AirLink-Windows
          path: server/AirLink.exe
          if-no-files-found: error

  android:
    name: 安卓客户端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK，不需要 android-actions/setup-android
      # （它还在尝试安装已下架的 tools 包，会直接失败）
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AirLink-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p out
          cp artifacts/AirLink-Windows/AirLink.exe out/AirLink-Windows.exe
          cp artifacts/AirLink-Android/*.apk out/AirLink-Android.apk
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
